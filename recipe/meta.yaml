{% set name = "htbuilder" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/htbuilder-{{ version }}.tar.gz
  sha256: 58c0bc5502c1a46b42ae9e074c43ec0f6fdc24ed334936cb17e1ed5a8938aee2

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [py<37]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - more-itertools

test:
  imports:
    - htbuilder
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/tvst/htbuilder
  dev_url: https://github.com/tvst/htbuilder
  doc_url: https://github.com/tvst/htbuilder/blob/master/README.md
  summary: A purely-functional HTML builder for Python. Think JSX rather than templates.
  description: |
    htbuilder lets you build HTML strings using a purely functional syntax in Python. Why use
    templating languages when you can just use functions?
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache

extra:
  recipe-maintainers:
    - ELundby45
